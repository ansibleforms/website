# Just the Docs Configuration
# https://just-the-docs.com/

# Theme : the just-the-docs gem, pinned in Gemfile.lock and kept up to date by Dependabot
theme: just-the-docs

# Site settings
title: AnsibleForms 6.x Documentation
description: Technical documentation for AnsibleForms
baseurl: "" # Empty for custom domain
url: "https://ansibleforms.com" # Custom domain

# Color scheme (light or dark)
color_scheme: light

# Enable color scheme toggle button
# Users can switch between light and dark mode
callouts_level: quiet
callouts:
  note:
    color: blue
  warning:
    color: yellow

# Logo and Favicon
logo: "/assets/images/logo.png"
favicon_ico: "/favicon.svg"

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation
nav_sort: case_insensitive

# Docs versions : the selector at the top of the menu (_includes/version_select.html)
docs_version: "6"
docs_versions:
  - name: "7"
    title: "7.x (latest)"
    url: "/"
  - name: "6"
    title: "6.x"
    url: "/v6/"

# Aux links (top right)
aux_links:
  "GitHub":
    - "https://github.com/ansibleforms/ansibleforms"
  "Image":
    - "https://github.com/ansibleforms/ansibleforms/pkgs/container/ansibleforms"
  "Charts":
    - "https://ansibleforms.com/helm-charts/"

# Open the aux links to other sites (GitHub, Image) in a new tab ; Charts stays on this site
# (_includes/components/aux_nav.html)
aux_links_new_tab: true

# Footer
footer_content: "Copyright &copy; 2023-2026 AnsibleForms. All rights reserved."

# "Edit this page on GitHub" at the bottom of every page : the link opens the page's source
# in the website repository (a page opts out with gh_edit_link: false in its front matter)
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/ansibleforms/website"
gh_edit_branch: "main"
gh_edit_source: source/v6
gh_edit_view_mode: "edit"

# Copy button on code blocks
enable_copy_code_button: true

# Code highlighting
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: yaml
    block:
      line_numbers: false
    span:
      line_numbers: false

# Configure Rouge highlighter
highlighter: rouge

# Collections : the menu is split into groups, each a collection with a heading in the sidebar
# (just_the_docs.collections below), led by a Font Awesome icon (_includes/components/site_nav.html).
# nav_fold makes each group collapsible : they start closed, except the group of the current page.
# The permalink keeps every page on the url it had before the groups existed :
# _configure/seed/index.md is still /seed/, faq.md still /faq.html.
collections:
  get_started:
    permalink: "/:path:output_ext"
    output: true
  configure:
    permalink: "/:path:output_ext"
    output: true
  build_forms:
    permalink: "/:path:output_ext"
    output: true
  use:
    permalink: "/:path:output_ext"
    output: true
  integrate:
    permalink: "/:path:output_ext"
    output: true
  reference:
    permalink: "/:path:output_ext"
    output: true

just_the_docs:
  collections:
    get_started:
      name: Get started
      icon: rocket
      nav_fold: true
    configure:
      name: Configure
      icon: sliders
      nav_fold: true
    build_forms:
      name: Build forms
      icon: wand-magic-sparkles
      nav_fold: true
    use:
      name: User guide
      icon: display
      nav_fold: true
    integrate:
      name: Integrate
      icon: plug
      nav_fold: true
    reference:
      name: Reference
      icon: book
      nav_fold: true

# Sass : just-the-docs still uses @import, global built-in functions and darken(), which
# Dart Sass deprecates. Silence them as the theme itself does in its own _config.yml
# (just-the-docs issues 1541 and 1607) ; the warnings are the theme's to fix, not ours.
sass:
  quiet_deps: true
  silence_deprecations: ['import']

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-redirect-from # the old one-screen GUI pages point to their group page
