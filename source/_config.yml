# Just the Docs Configuration
# https://just-the-docs.com/

# Theme : the just-the-docs gem, pinned in Gemfile.lock and kept up to date by Dependabot
theme: just-the-docs

# Site settings
title: AnsibleForms Documentation
description: Technical documentation for AnsibleForms
baseurl: "" # Empty for custom domain
url: "https://ansibleforms.com" # Custom domain

# Color scheme (light or dark)
color_scheme: light

# Enable color scheme toggle button
# Users can switch between light and dark mode
callouts_level: quiet
callouts:
  note:
    color: blue
  warning:
    color: yellow

# Logo and Favicon
logo: "/assets/images/logo.png"
favicon_ico: "/favicon.svg"

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation
nav_sort: case_insensitive

# Aux links (top right)
aux_links:
  "Docs for 6.x":
    - "/v6/"
  "GitHub":
    - "https://github.com/ansibleforms/ansibleforms"
  "Docker Hub":
    - "https://hub.docker.com/r/ansibleguy/ansibleforms"

# Footer
footer_content: "Copyright &copy; 2023-2026 AnsibleForms. All rights reserved."

# Code highlighting
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: yaml
    block:
      line_numbers: false
    span:
      line_numbers: false

# Configure Rouge highlighter
highlighter: rouge

# Collections
collections:
  docs:
    permalink: "/:collection/:path/"
    output: true

# Sass : just-the-docs still uses @import, global built-in functions and darken(), which
# Dart Sass deprecates. Silence them as the theme itself does in its own _config.yml
# (just-the-docs issues 1541 and 1607) ; the warnings are the theme's to fix, not ours.
sass:
  quiet_deps: true
  silence_deprecations: ['import']

# Exclude from build
exclude:
  - v6 # built on its own into /v6/

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-include-cache
