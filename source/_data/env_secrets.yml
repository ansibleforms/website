# Environment variables that hold a secret. The variable tables mark them with a "Secret"
# badge. The list matches the variables the settings pages mask : the server hides the
# value of every name matching /_PASSWORD$|_SECRET$|_TOKEN$|_SECRET_PREVIOUS$/
# (config.controller.js).
- DB_PASSWORD
- ADMIN_PASSWORD
- ACCESS_TOKEN_SECRET
- ENCRYPTION_SECRET
- ENCRYPTION_SECRET_PREVIOUS
- VAULT_TOKEN
- METRICS_TOKEN
- RTE_TOKEN
- RTE_JOIN_TOKEN
