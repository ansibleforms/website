# A throwaway AnsibleForms instance for the screenshots, with its own database and its own RTE
# (runtime environment : AnsibleForms 7 runs every playbook there, none in the app itself).
# run.sh starts it from a copy of ./data and removes it, volumes included, afterwards.
name: af-screenshots
x-database: &database
  DB_HOST: db
  DB_PORT: 3306
  DB_USER: root
  DB_PASSWORD: Screenshots!123
  ENCRYPTION_SECRET: Screenshots!Encryption!Secret!1
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: Screenshots!123
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
  app:
    image: ghcr.io/ansibleforms/ansibleforms:${AF_VERSION:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *database
      PORT: 443
      HTTPS: 1
      # the public default password : seed.mjs changes it through the api, as the app asks
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: AnsibleForms!123
      # data/seed.yaml declares the RTE's credential (this token) and its runner, rte_mode inbound
      CONFIG_SEED_PATH: /app/dist/persistent/seed.yaml
      RTE_TOKEN: Screenshots!RTE!Token!123
    # healthy once the app answers, which it only does after creating the schema
    healthcheck:
      test: ["CMD", "node", "./healthcheck.js"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    ports:
      - "${AF_PORT:-8444}:443"
    volumes:
      - ${AF_DATA:?the copy of ./data that run.sh makes}:/app/dist/persistent
  # runs the playbooks of the seeded jobs : the app dials it on http://rte:8000 with RTE_TOKEN
  # (RTE_MODE=inbound) and keeps one WebSocket open, so the RTE holds no database settings.
  rte:
    image: ghcr.io/ansibleforms/ansibleforms-rte-full:${AF_VERSION:-latest}
    depends_on:
      app:
        condition: service_healthy
    environment:
      AF_ROLE: rte
      RTE_MODE: inbound
      RTE_TOKEN: Screenshots!RTE!Token!123
      # its files are the app's own (the same folder, mounted below)
      RTE_FILES: local
      PORT: 8000
      HTTPS: 0
    healthcheck:
      test: ["CMD", "node", "./healthcheck.js"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    volumes:
      - ${AF_DATA:?the copy of ./data that run.sh makes}:/app/dist/persistent
