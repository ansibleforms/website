- name: Restart Web Service
  type: ansible
  playbook: change.yaml
  description: Restart the web service of a server
  categories:
  - Web Servers
  roles:
  - public
  icon: globe
  overlayIcon: rotate-right
  overlayIconColor: warning
  tileClass: bg-warning-subtle text-bg-warning
  fields:
  - type: text
    name: target
    label: Target
    icon: bullseye
    default: srv-prd-001
    required: true
  - type: textarea
    name: reason
    label: Reason
    default: Planned change
