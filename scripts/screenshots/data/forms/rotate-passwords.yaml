- name: Rotate Passwords
  type: ansible
  playbook: change.yaml
  description: Rotate the local administrator passwords
  categories:
  - Settings
  roles:
  - public
  icon: key
  overlayIcon: rotate
  overlayIconColor: warning
  tileClass: bg-warning-subtle text-bg-warning
  fields:
  - type: text
    name: target
    label: Target
    icon: bullseye
    default: srv-prd-001
    required: true
  - type: textarea
    name: reason
    label: Reason
    default: Planned change
