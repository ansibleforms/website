- name: Remove Virtual Host
  type: ansible
  playbook: change.yaml
  description: Remove a virtual host from a web server
  categories:
  - Web Servers
  roles:
  - public
  icon: sitemap
  overlayIcon: trash-can
  overlayIconColor: danger
  tileClass: bg-danger-subtle text-bg-danger
  fields:
  - type: text
    name: target
    label: Target
    icon: bullseye
    default: srv-prd-001
    required: true
  - type: textarea
    name: reason
    label: Reason
    default: Planned change
