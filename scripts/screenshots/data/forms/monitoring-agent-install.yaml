- name: Monitoring Agent Install
  type: ansible
  playbook: change.yaml
  description: Install and register the monitoring agent
  categories:
  - Setup
  roles:
  - public
  icon: chart-line
  overlayIcon: download
  overlayIconColor: info
  tileClass: bg-info-subtle text-bg-info
  fields:
  - type: text
    name: target
    label: Target
    icon: bullseye
    default: srv-prd-001
    required: true
  - type: textarea
    name: reason
    label: Reason
    default: Planned change
