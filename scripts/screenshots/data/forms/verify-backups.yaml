- name: Verify Backups
  type: ansible
  playbook: change.yaml
  description: Restore a sample of last night's backups
  categories:
  - Backups
  roles:
  - public
  icon: floppy-disk
  overlayIcon: check
  overlayIconColor: info
  tileClass: bg-info-subtle text-bg-info
  fields:
  - type: text
    name: target
    label: Target
    icon: bullseye
    default: srv-prd-001
    required: true
  - type: textarea
    name: reason
    label: Reason
    default: Planned change
