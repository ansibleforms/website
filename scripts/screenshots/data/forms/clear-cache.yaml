- name: Clear Cache
  type: ansible
  playbook: change.yaml
  description: Clear the application cache
  categories:
  - Operations
  roles:
  - public
  icon: broom
  overlayIcon: trash-can
  overlayIconColor: danger
  tileClass: bg-danger-subtle text-bg-danger
  fields:
  - type: text
    name: target
    label: Target
    icon: bullseye
    default: srv-prd-001
    required: true
  - type: textarea
    name: reason
    label: Reason
    default: Planned change
