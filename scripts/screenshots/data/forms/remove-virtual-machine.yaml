- name: Remove Virtual Machine
  type: ansible
  playbook: change.yaml
  description: Decommission a virtual machine and free its resources
  categories:
  - Instances
  roles:
  - public
  icon: server
  overlayIcon: trash-can
  overlayIconColor: danger
  tileClass: bg-danger-subtle text-bg-danger
  fields:
  - type: text
    name: target
    label: Target
    icon: bullseye
    default: srv-prd-001
    required: true
  - type: textarea
    name: reason
    label: Reason
    default: Planned change
