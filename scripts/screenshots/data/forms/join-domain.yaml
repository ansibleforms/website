- name: Join Domain
  type: ansible
  playbook: change.yaml
  description: Join a server to the Active Directory domain
  categories:
  - Setup
  roles:
  - public
  icon: network-wired
  overlayIcon: plus
  overlayIconColor: success
  tileClass: bg-success-subtle text-bg-success
  fields:
  - type: text
    name: target
    label: Target
    icon: bullseye
    default: srv-prd-001
    required: true
  - type: textarea
    name: reason
    label: Reason
    default: Planned change
