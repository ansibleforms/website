- name: Database Storage deletion
  type: ansible
  playbook: change.yaml
  description: Permanently remove storage luns that past retention.
  categories:
  - Database
  roles:
  - public
  icon: database
  overlayIcon: trash-can
  overlayIconColor: danger
  tileClass: bg-danger-subtle text-bg-danger
  fields:
  - type: text
    name: target
    label: Target
    icon: bullseye
    default: srv-prd-001
    required: true
  - type: textarea
    name: reason
    label: Reason
    default: Planned change
