- name: Backup Retention Cleanup
  type: ansible
  playbook: change.yaml
  description: Remove backups that past retention
  categories:
  - Backups
  roles:
  - public
  icon: floppy-disk
  overlayIcon: trash-can
  overlayIconColor: danger
  tileClass: bg-danger-subtle text-bg-danger
  fields:
  - type: text
    name: target
    label: Target
    icon: bullseye
    default: srv-prd-001
    required: true
  - type: textarea
    name: reason
    label: Reason
    default: Planned change
