- name: File Share recovery
  type: ansible
  playbook: change.yaml
  description: Online, mount and rename volume back to original state
  categories:
  - Recovery
  roles:
  - public
  icon: folder-open
  overlayIcon: trash-can-arrow-up
  overlayIconColor: warning
  tileClass: bg-warning-subtle text-bg-warning
  fields:
  - type: text
    name: target
    label: Target
    icon: bullseye
    default: srv-prd-001
    required: true
  - type: textarea
    name: reason
    label: Reason
    default: Planned change
