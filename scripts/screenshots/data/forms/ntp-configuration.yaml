- name: NTP Configuration
  type: ansible
  playbook: change.yaml
  description: Point a server to the corporate time servers
  categories:
  - Settings
  roles:
  - public
  icon: clock
  overlayIcon: gear
  overlayIconColor: info
  tileClass: bg-info-subtle text-bg-info
  fields:
  - type: text
    name: target
    label: Target
    icon: bullseye
    default: srv-prd-001
    required: true
  - type: textarea
    name: reason
    label: Reason
    default: Planned change
