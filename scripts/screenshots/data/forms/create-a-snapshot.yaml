- name: Create a snapshot
  type: ansible
  playbook: change.yaml
  description: Create a snapshot of database volume
  categories:
  - Instances
  roles:
  - public
  icon: camera
  overlayIcon: plus
  overlayIconColor: success
  tileClass: bg-success-subtle text-bg-success
  fields:
  - type: text
    name: target
    label: Target
    icon: bullseye
    default: srv-prd-001
    required: true
  - type: textarea
    name: reason
    label: Reason
    default: Planned change
