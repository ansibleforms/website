- name: File Share offline
  type: ansible
  playbook: change.yaml
  description: Rename, unmount and offline a volume
  categories:
  - Recovery
  roles:
  - public
  icon: folder-open
  overlayIcon: power-off
  overlayIconColor: danger
  tileClass: bg-danger-subtle text-bg-danger
  fields:
  - type: text
    name: target
    label: Target
    icon: bullseye
    default: srv-prd-001
    required: true
  - type: textarea
    name: reason
    label: Reason
    default: Planned change
