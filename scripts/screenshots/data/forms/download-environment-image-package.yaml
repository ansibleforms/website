- name: Download Environment Image Package
  type: ansible
  playbook: change.yaml
  description: Download Environment Image Package
  categories:
  - Updates
  roles:
  - public
  icon: cube
  overlayIcon: download
  overlayIconColor: info
  tileClass: bg-info-subtle text-bg-info
  fields:
  - type: text
    name: target
    label: Target
    icon: bullseye
    default: srv-prd-001
    required: true
  - type: textarea
    name: reason
    label: Reason
    default: Planned change
