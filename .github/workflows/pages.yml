name: Site

# Builds ansibleforms.com. A pull request BUILDS the site but does not deploy it ; main
# deploys.
#
# Two files come from the app repository at build time, never as a copy kept here :
#   CHANGELOG.md     -> changelog.md (and v6/changelog.md from release/6.x)
#   server/help.yaml -> _data/help.yaml, the settings reference most pages render
# The app owns both, so the site is rebuilt when the app releases : its release workflow
# sends a repository_dispatch (app-release) here. The nightly run catches a lost one.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [app-release]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # deploys keep the single "pages" group and are never cancelled ; each PR gets its own
  group: pages-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # a required check in the main ruleset - renaming it breaks that rule
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Public repository, so no token. Only the two files the site needs are checked out.
      - name: Check out the app's changelog and settings help
        uses: actions/checkout@v7
        with:
          repository: ansibleforms/ansibleforms
          ref: main
          path: _app
          sparse-checkout: |
            CHANGELOG.md
            server/help.yaml
          sparse-checkout-cone-mode: false

      - name: Check out the 6.x changelog
        uses: actions/checkout@v7
        with:
          repository: ansibleforms/ansibleforms
          ref: release/6.x
          path: _app6
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Bring in the changelogs and the settings help
        run: |
          mkdir -p _data
          cp _app/server/help.yaml _data/help.yaml
          front='---\nlayout: default\ntitle: Changelog\nnav_order: 10\n---\n\n'
          { printf -- "$front"; cat _app/CHANGELOG.md; } > changelog.md
          { printf -- "$front"; cat _app6/CHANGELOG.md; } > v6/changelog.md

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          cache-version: 0

      # skipped on a pull request : it calls the Pages API, and a fork's token cannot.
      # base_path is then empty, which jekyll reads as the site root - fine for a build
      # that is only ever thrown away.
      - name: Setup Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # The docs of the maintenance line, frozen under /v6/ : 6.x users still need the
      # pages that match their version.
      - name: Build the 6.x docs
        run: bundle exec jekyll build --source v6 --destination _site/v6 --baseurl "${{ steps.pages.outputs.base_path }}/v6"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
