name: Site

# Builds ansibleforms.com from source/. A pull request BUILDS the site but does not deploy
# it ; main deploys.
#
# Two files come from the app repository at build time, never as a copy kept here :
#   CHANGELOG.md     -> source/_reference/changelog.md (and source/v6/_reference/changelog.md from release/6.x)
#   server/help.yaml -> source/_data/help.yaml, the settings reference most pages render
# The app owns both, so the site is rebuilt when the app releases : its release workflow
# sends a repository_dispatch (app-release) here. The nightly run catches a lost one.
#
# The Helm chart repository is published here too, at ansibleforms.com/helm-charts/ : the
# chart packages attached to the releases of ansibleforms/helm-charts, indexed at build
# time. A chart release sends chart-release, and the nightly run catches a lost one.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [app-release, chart-release]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # deploys keep the single "pages" group and are never cancelled ; each PR gets its own
  group: pages-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # a required check in the main ruleset - renaming it breaks that rule
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Public repository, so no token. Only the two files the site needs are checked out.
      - name: Check out the app's changelog and settings help
        uses: actions/checkout@v7
        with:
          repository: ansibleforms/ansibleforms
          ref: main
          path: _app
          sparse-checkout: |
            CHANGELOG.md
            server/help.yaml
          sparse-checkout-cone-mode: false

      - name: Check out the 6.x changelog
        uses: actions/checkout@v7
        with:
          repository: ansibleforms/ansibleforms
          ref: release/6.x
          path: _app6
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Bring in the changelogs and the settings help
        run: |
          mkdir -p source/_data
          cp _app/server/help.yaml source/_data/help.yaml
          front='---\nlayout: default\ntitle: Changelog\nnav_order: 3\ngh_edit_link: false\n---\n\n'
          { printf -- "$front"; cat _app/CHANGELOG.md; } > source/_reference/changelog.md
          { printf -- "$front"; cat _app6/CHANGELOG.md; } > source/v6/_reference/changelog.md

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          cache-version: 0

      # skipped on a pull request : it calls the Pages API, and a fork's token cannot.
      # base_path is then empty, which jekyll reads as the site root - fine for a build
      # that is only ever thrown away.
      - name: Setup Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        run: bundle exec jekyll build --source source --destination _site --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # The docs of the maintenance line, frozen under /v6/ : 6.x users still need the
      # pages that match their version.
      - name: Build the 6.x docs
        run: bundle exec jekyll build --source source/v6 --destination _site/v6 --baseurl "${{ steps.pages.outputs.base_path }}/v6"
        env:
          JEKYLL_ENV: production

      - uses: azure/setup-helm@v5

      # The Helm repository at /helm-charts/. Every chart release of ansibleforms/helm-charts
      # is downloaded and indexed, so the index is rebuilt from scratch on every run and never
      # kept as state. A failed download fails the build: deploying an index that silently
      # lost versions would break every helm repo that points here.
      - name: Publish the Helm chart repository
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: ${{ steps.pages.outputs.base_url || 'https://ansibleforms.com' }}
        run: |
          set -euo pipefail
          out=_site/helm-charts
          mkdir -p "$out"
          tags="$(gh release list -R ansibleforms/helm-charts --limit 200 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName')"
          [ -n "$tags" ] || { echo "::error::ansibleforms/helm-charts has no releases to publish."; exit 1; }
          for tag in $tags; do
            gh release download "$tag" -R ansibleforms/helm-charts --dir "$out" --pattern '*.tgz' --clobber
          done
          helm repo index "$out" --url "${SITE_URL}/helm-charts/"

          # The newest release has to be in the index, or something went missing on the way
          latest="$(gh release view -R ansibleforms/helm-charts --json tagName --jq .tagName)"
          grep -q "version: ${latest#v}\$" "$out/index.yaml" || {
            echo "::error::The index does not contain $latest, the newest chart release."; exit 1; }
          echo "Indexed $(ls "$out"/*.tgz | wc -l) chart packages, newest $latest"

          # Artifact Hub reads its repository metadata from the root of the chart repository
          gh api repos/ansibleforms/helm-charts/contents/artifacthub-repo.yml \
            -H 'Accept: application/vnd.github.raw' > "$out/artifacthub-repo.yml"

          cat > "$out/index.html" <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <title>AnsibleForms Helm charts</title>
          <h1>AnsibleForms Helm charts</h1>
          <p>Add this repository with:</p>
          <pre>helm repo add ansibleforms ${SITE_URL}/helm-charts/
          helm repo update
          helm search repo ansibleforms</pre>
          <p>Or pull the chart straight from the OCI registry:</p>
          <pre>helm pull oci://ghcr.io/ansibleforms/charts/ansibleforms</pre>
          <p><a href="index.yaml">index.yaml</a> - the chart source is
          <a href="https://github.com/ansibleforms/helm-charts">ansibleforms/helm-charts</a>.</p>
          EOF

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
