version: 2

# Dependabot keeps every dependency on its latest version, majors included : the Build check
# builds both sites on each pull request, so a breaking major fails there before it merges.
# The theme (just-the-docs) is a gem, so it is updated like the others. Updates are never
# grouped : every dependency gets its own pull request, so each one can be reviewed and
# reverted on its own.
#
# Every pull request title must pass the PR / Title check (Conventional Commits) : build for
# the Ruby gems that build the site, ci for the workflow actions.

updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
